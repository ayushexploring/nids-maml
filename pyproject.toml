[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nids-maml"
version = "0.1.0"
description = "Few-shot network intrusion detection with meta-learned Transformer encoders"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["nids_maml*"]
